# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Animations Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# https://wiki.hyprland.org/Configuring/Animations/

# ┌─────────────────────────────────────────────────────────────┐
# │ Syntax Reference:                                           │
# │                                                             │
# │ bezier = name, x1, y1, x2, y2                               │
# │   - name: identifier to reference this curve                │
# │   - x1, y1: first control point (0.0 - 1.0)                 │
# │   - x2, y2: second control point (y can exceed 1.0)         │
# │                                                             │
# │ animation = name, onoff, speed, curve, [style]              │
# │   - name: animation to configure (e.g., windowsIn, border)  │
# │   - onoff: 1 = enabled, 0 = disabled                        │
# │   - speed: animation speed multiplier (lower = faster)      │
# │   - curve: bezier curve name (e.g., default, overshot)      │
# │   - style: (optional) slide, popin X%, slidefade X%, etc.   │
# └─────────────────────────────────────────────────────────────┘

animations {
    enabled = yes

    # bezier = name,   x1,   y1,   x2,   y2
    bezier = overshot, 0.13, 0.99, 0.29, 1.1

    # animation = name,          onoff, speed, curve,    [style]
    animation = windowsIn,       1,     2.5,     overshot, slide
    animation = windowsOut,      1,     3.5,     default,  popin 80%
    animation = border,          1,     3.5,     default
    animation = workspacesIn,    1,     3.5,     overshot, slide
    animation = workspacesOut,   1,     3.5,     overshot, slidefade 80%
}
